<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme BEFORE first paint so there's no flash of the
         wrong theme. Dark is the demo's default look. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gac_theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'dark';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Fonts load from the HTML (with preconnect) instead of a render-blocking
         @import buried in the CSS bundle — faster first paint on slow mobile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Guarded Agent Chat — chat freely with an unrestricted support agent while a two-layer guardrail decides which of its SQL queries actually run." />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Guarded Agent Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
